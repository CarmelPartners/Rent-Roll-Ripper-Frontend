# Build + deploy the frontend to the PRODUCTION Azure App Service.
#
# Scaffolded ahead of the production resource existing — see backend/README.md's
# "Deployment" section for what's still needed (a prod App Service, a prod backend
# Function App to point VITE_API_BASE_URL at, this repo's "production" environment
# secrets, and this workflow's VITE_API_BASE_URL filled in below) before this can
# actually deploy anything.
name: Deploy - Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  # TODO: set once a production backend Function App exists.
  VITE_API_BASE_URL: ''

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # GitHub environment "production" — scope its variables/secrets here, and add
    # required reviewers (Settings > Environments > production) to gate deploys.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # OIDC login — no stored secret. Requires an App Registration (or user-assigned
      # Managed Identity) with a federated credential for this repo's "production"
      # environment, and a role (e.g. Contributor / Website Contributor) on the App Service.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT }}     # optional variable; blank = production slot
          package: ./dist
