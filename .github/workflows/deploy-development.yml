# Build + deploy the frontend to the DEVELOPMENT Azure App Service
# (dev-app-service-rent-roll-ripper-westus, Node 24-lts, Linux).
#
# The app is a static Vite/React build served via
# `pm2 serve /home/site/wwwroot 8080 --no-daemon --spa` (startup command set on the
# resource — see backend README's counterpart note). Vite inlines VITE_* env vars at
# BUILD time, so the backend API URL must be baked in during this workflow's build
# step, not read at runtime.
#
# We build fully here (with devDependencies available) and deploy only the resulting
# static `dist/` output — no remote/Oryx build on the App Service side.
name: Deploy - Development

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  # The DEV backend Function App's HTTP-triggered API base URL, baked in at build time.
  VITE_API_BASE_URL: https://dev-function-app-rent-roll-ripper-westus-fxcvggcjhsguhpfw.westus3-01.azurewebsites.net/api

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environment "development" — scope its variables/secrets here
    # (Settings > Environments > development).
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # OIDC login — no stored secret. Requires an App Registration (or user-assigned
      # Managed Identity) with a federated credential for this repo's "development"
      # environment, and a role (e.g. Contributor / Website Contributor) on the App Service.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Development)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}   # dev-app-service-rent-roll-ripper-westus
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT }}     # optional variable; blank = production slot
          package: ./dist
